name: Test Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  test-check:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://astral.sh/uv/install.ps1 | Invoke-Expression

      - name: Create and activate virtual environment
        shell: pwsh
        run: |
          uv venv .venv --python=3.11.12

      - name: Install dependencies
        shell: pwsh
        run: |
          .\.venv\Scripts\Activate.ps1
          uv sync --group dev

      - name: Checkout test repo
        id: checkout-test-repo
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name && format('{0}/sr-od-test', github.event.pull_request.head.repo.owner.login) || 'OneDragon-Anything/sr-od-test') || 'OneDragon-Anything/sr-od-test' }}
          path: sr-od-test
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
          fetch-depth: 1
          persist-credentials: false
        continue-on-error: true

      - name: Checkout test repo (default branch)
        id: checkout-test-repo-default
        if: steps.checkout-test-repo.outcome == 'failure'
        uses: actions/checkout@v5
        with:
          repository: OneDragon-Anything/sr-od-test
          path: sr-od-test
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Pre-download YOLO model (CI bypasses ghfast.top proxy; direct github)
        shell: pwsh
        run: |
          # cal_pos/sim_uni 集成测试需 YOLO 模型；loader 默认走 ghfast.top 代理在 CI 会失败。
          # CI 直连 github release 预下载到 loader 期望的目录，check_model_exists 通过 → 不触发下载。
          $url = "https://github.com/OneDragon-Anything/OneDragon-YOLO/releases/download/sr_model/yolov8n-640-simuni-0601.zip"
          $tmp = "$env:TEMP\yolo.zip"
          Invoke-WebRequest -Uri $url -OutFile $tmp
          foreach ($cat in @("world_patrol", "sim_uni")) {
            $dst = "assets\models\$cat\yolov8n-640-simuni-0601"
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            Expand-Archive -Path $tmp -DestinationPath $dst -Force
          }
          Write-Host "YOLO model pre-downloaded to world_patrol + sim_uni"

      - name: Run tests
        shell: pwsh
        run: |
          chcp 65001
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::InputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          .\.venv\Scripts\Activate.ps1
          
          uv run pytest sr-od-test/ -v --tb=short --color=yes
        env:
          PYTHONIOENCODING: utf-8


      - name: Test failure notification
        if: failure()
        run: |
          $message = @"
            ::notice::当前触发事件: ${{ github.event_name }}
            ::error::测试失败！请检查上方的测试结果并修复问题。
            ::notice::您可以fork测试仓库 https://github.com/OneDragon-Anything/sr-od-test 创建相同分支来修改测试代码
            ::notice::您可以使用以下命令在本地运行测试: uv run pytest sr-od-test/ -v
          "@
          Write-Host $message
        shell: pwsh